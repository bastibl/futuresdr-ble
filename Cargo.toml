[package]
name = "futuresdr-ble"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
default-run = "sniffer"

[workspace]

[[bin]]
name = "sniffer"
path = "src/main.rs"

[features]
default = ["soapy"]
rtlsdr = ["futuresdr/rtlsdr"]
soapy = ["futuresdr/soapy"]
uhd = ["futuresdr/uhd"]

[dependencies]
anyhow = "1.0.104"
futuresdr = { version = "0.10.0", features = ["seify"] }
futuredsp = "0.10.0"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Enable browser entropy for FutureSDR's random-number dependencies.
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
futuresdr = { version = "0.10.0", features = ["mocker", "seify"] }
