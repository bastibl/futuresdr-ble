[package]
name = "futuresdr-ble"
version = "0.1.0"
edition = "2024"
default-run = "sniffer"

[workspace]

[[bin]]
name = "sniffer"
path = "src/main.rs"

[features]
default = ["soapy"]
rtlsdr = ["futuresdr/rtlsdr"]
soapy = ["futuresdr/soapy"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
futuresdr = { version = "0.6.0", features = ["seify"] }
futuredsp = "0.6.0"
yagi = "0.1.5"
