[package]
name = "futuresdr-ble"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
default-run = "sniffer"

[workspace]

[[bin]]
name = "sniffer"
path = "src/main.rs"

[features]
default = ["soapy"]
rtlsdr = ["futuresdr/rtlsdr"]
soapy = ["futuresdr/soapy"]
uhd = ["futuresdr/uhd"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
futuresdr = { path = "../futuresdr", features = ["seify"] }
futuredsp = { path = "../futuresdr/crates/futuredsp" }
yagi = "0.1.5"

[dev-dependencies]
futuresdr = { path = "../futuresdr", features = ["mocker", "seify"] }
